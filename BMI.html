<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 400px;
        }
        h1 {
            color: purple;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            outline: none;
            background: #333;
            color: #fff;
        }
        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            border: none;
            background: purple;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover{
            background-color: rgb(212, 0, 255);
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background: #333;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <label for="age">Age (2 - 120 years)</label>
        <input type="number" id="age" min="2" max="120" placeholder="Enter your age">
        
        <label for="height">Height (cm)</label>
        <input type="number" id="height" placeholder="Enter height in cm">
        
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" placeholder="Enter weight in kg">
        
        <button onclick="calculateBMI()">Calculate</button>
        
        <div class="result" id="bmiResult">Your BMI will appear here</div>
    </div>
    
    <script>
        function calculateBMI() {
            const age = document.getElementById('age').value;
            const height = document.getElementById('height').value;
            const weight = document.getElementById('weight').value;
            
            if (age < 2 || age > 120) {
                alert("Please enter a valid age between 2 and 120.");
                return;
            }
            if (!height || !weight) {
                alert("Please enter valid height and weight.");
                return;
            }
            
            const heightInMeters = height / 100;
            const bmi = (weight / (heightInMeters * heightInMeters)).toFixed(2);
            
            let category = '';
            if (bmi < 18.5) category = 'Underweight';
            else if (bmi < 25) category = 'Normal';
            else if (bmi < 30) category = 'Overweight';
            else category = 'Obesity';
            
            document.getElementById('bmiResult').innerHTML = `Your BMI is <strong>${bmi}</strong> (${category})`;
        }
    </script>
</body>
</html>
