<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity - ZenFit</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <style>
      .activity {
        margin: 0;
        padding: 50px 0;
        background: linear-gradient(135deg, #0f172a, #0f172a);
        color: white;
        text-align: center;
      }

      .activity h2 {
        font-size: 36px;
        margin-bottom: 30px;
        color: #e2e8f0;
      }

      .activity-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .option {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
        width: 80%;
        height: 300px;
        margin: 0 auto;
        text-align: center;
        position: relative;
        color: white;
      }

      .option::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 10px;
      }

      .option:hover {
        transform: translateY(-5px);
      }

      .option h3,
      .option p,
      .option button {
        position: relative;
        z-index: 2;
      }

      .option h3 {
        font-size: 24px;
        margin-bottom: 15px;
        color: #e2e8f0;
      }

      .option p {
        font-size: 18px;
        margin-bottom: 20px;
        color: #e2e8f0;
        text-align: center;
      }

      .option button {
        background: purple;
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0px 4px 10px rgba(255, 117, 140, 0.5);
      }

      .option button:hover {
        background: linear-gradient(135deg, #ff5ae6, #ff3cf2);
        transform: scale(1.05);
        box-shadow: 0px 6px 15px rgba(255, 92, 212, 0.6);
      }
    </style>
  </head>
  <body style="background-color: #0f172a">
    <nav class="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="activity.html">Activity Statistics</a></li>
        <li><a href="food.html">Food Recommendations</a></li>
        <li><a href="log.html">SIGN-IN / SIGN-UP</a></li>
      </ul>
    </nav>
    <section class="activity">
      <h2>Track Your Activity</h2>
      <div class="activity-options">
        <div class="option" style="background-image: url(./Images/BMI.png)" ;>
          <h3>Check Your BMI</h3>
          <p>
            Calculate your Body Mass Index (BMI) to assess your fitness level.
          </p>
          <button><a href="BMI.html">Calculate</a></button>
        </div>
        <div class="option" style="background-image: url(./Images/workout.jpg)">
          <h3>Workout Progress</h3>
          <p>View your workout history and track progress over time.</p>
          <button>View Progress</button>
        </div>
      </div>
    </section>
  </body>
</html>
