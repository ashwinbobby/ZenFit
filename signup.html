<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="container">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <input type="text" id="fullName" class="input-field" placeholder="Full Name" required>
            <input type="email" id="email" class="input-field" placeholder="Email" required>
            <input type="password" id="password" class="input-field" placeholder="Password" required>
            <button type="submit" class="btn">Sign Up</button>
        </form>

        <p>Or sign up with:</p>
        <div class="social-login">
            <button class="google-btn" onclick="socialLogin('Google')">Sign up with Google</button>
            <button class="facebook-btn" onclick="socialLogin('Facebook')">Sign up with Facebook</button>
        </div>

        <p>Already have an account? <a href="login.html" class="link">Login</a></p>
    </div>

    <script src="signup.js"></script>
</body>
</html>
