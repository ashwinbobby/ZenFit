<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Tutorials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Roboto+Mono:wght@100..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0f172a;
            color: white;
            text-align: center;
            font-family: "Roboto Mono", serif;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .video {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        iframe {
            width: 100%;
            height: 200px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h2>Exercise Tutorials</h2>
    <div class="container">
        <div class="video">
            <iframe src="https://www.youtube.com/embed/IODxDxX7oi4" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            <p>Push-ups</p>
        </div>
        <div class="video">
            <iframe src="https://www.youtube.com/embed/xqvCmoLULNY" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            <p>Squats</p>
        </div>
        <div class="video">
            <iframe src="https://www.youtube.com/embed/ASdvN_XEl_c" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            <p>Plank</p>
        </div>
        <div class="video">
            <iframe src="https://www.youtube.com/embed/u3zgHI8QnqE" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            <p>Jump Rope</p>
        </div>
        <div class="video">

            <p>Lunges</p>
        </div>
        <div class="video">
            <iframe src="https://www.youtube.com/embed/qLBImHhCXSw" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            <p>Burpees</p>
        </div>
        <div class="video">

            <p>Deadlifts</p>
        </div>
        <div class="video">
            <iframe src="https://www.youtube.com/embed/uO_CNYidOw0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            <p>Bicep Curls</p>
        </div>
        <div class="video">

</body>
</html>
