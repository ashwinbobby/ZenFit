<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Tutorials</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0f172a;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .video {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
        }
        h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h2>Exercise Tutorials</h2>
    <div class="container">
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/dyM_3FdsCXo" frameborder="0" allowfullscreen></iframe>
            <p>Push-ups</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/9efgcAjQe7E" frameborder="0" allowfullscreen></iframe>
            <p>Squats</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/gC2OJi5YJX8" frameborder="0" allowfullscreen></iframe>
            <p>Plank</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/JSkW28sA9IU" frameborder="0" allowfullscreen></iframe>
            <p>Jump Rope</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/YUOeSYs68Ww" frameborder="0" allowfullscreen></iframe>
            <p>Lunges</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/z7XBpjcjL1o" frameborder="0" allowfullscreen></iframe>
            <p>Burpees</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/dmYwZH_BNd0" frameborder="0" allowfullscreen></iframe>
            <p>Deadlifts</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/XeErfmGSwfE" frameborder="0" allowfullscreen></iframe>
            <p>Bicep Curls</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/IODxDxX7oi4" frameborder="0" allowfullscreen></iframe>
            <p>Triceps Dips</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/qrx1vyvtRLY" frameborder="0" allowfullscreen></iframe>
            <p>Mountain Climbers</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/W_EMMTb1wXY" frameborder="0" allowfullscreen></iframe>
            <p>Pull-ups</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/GtHNC-6JrFY" frameborder="0" allowfullscreen></iframe>
            <p>Russian Twists</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/VKBeu6KY3H0" frameborder="0" allowfullscreen></iframe>
            <p>Leg Raises</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/ZouR1A5F8ss" frameborder="0" allowfullscreen></iframe>
            <p>Jump Squats</p>
        </div>
        <div class="video">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/Y2eR-Tq1bx8" frameborder="0" allowfullscreen></iframe>
            <p>Box Jumps</p>
        </div>
    </div>
</body>
</html>
