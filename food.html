<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Food Recommendation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet" />
    <style>
        body {
            padding: 0;
            margin: 0;
            font-family: "Roboto Mono", serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
            color: white;
            background-image: url('Images/pexels-vanmalidate-842142.jpg');
            background-size: cover;
            background-position: center;
        }

        #meal-plan {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 20px;
        }

        #top-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        li {
            margin: 20px;
            list-style: none;
        }

        select {
            padding: 5px;
            width: 200px;
            background-color: black;
            color: white;
        }

        .navbar {
            width: 100%;
            /* position: fixed; */
            top: 0;
            left: 0;
            background: transparent;
            backdrop-filter: blur(0px);
            padding: 1rem 0;
            text-align: center;
            z-index: 1000;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 4rem;
        }

        .navbar ul li {
            display: inline;
        }

        .navbar ul li a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            transition: all 0.3s ease-in-out;
            position: relative;
            display: inline-block;
        }

        .navbar ul li a:hover {
            color: yellow;
            /* Changes text color to yellow */
            transform: scale(1.4);
            /* Increases size to 1.2x */
        }

        .navbar ul li a::after {
            content: "";
            display: block;
            height: 2px;
            width: 0;
            background: yellow;
            transition: width 0.4s ease-in-out;
        }

        .navbar ul li a:hover::after {
            width: 100%;
        }
        
        .transparency {
            background-color: rgb(0 0 0 / 0.2);
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const mealPlanContainer = document.getElementById("meal-plan");
            const dayFilter = document.getElementById("day-filter");

            async function fetchHealthyMeal(category) {
                try {
                    const response = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?c=${category}`);
                    const data = await response.json();
                    const randomMeal = data.meals[Math.floor(Math.random() * data.meals.length)].strMeal;
                    return randomMeal;
                } catch (error) {
                    console.error("Error fetching meal data:", error);
                    return "Unavailable";
                }
            }

            async function fetchMealPlan(day) {
                const meals = {
                    breakfast: await fetchHealthyMeal("Vegetarian"),
                    lunch: await fetchHealthyMeal("Seafood"),
                    dinner: await fetchHealthyMeal("Chicken")
                };
                renderMealPlan(day, meals);
            }

            function renderMealPlan(day, meals) {
                mealPlanContainer.innerHTML = `
                    <h2>Healthy Meal Plan for ${day}</h2>
                    <ul>
                        <li><strong>Breakfast:</strong> ${meals.breakfast}</li>
                        <li><strong>Lunch:</strong> ${meals.lunch}</li>
                        <li><strong>Dinner:</strong> ${meals.dinner}</li>
                    </ul>
                `;
            }

            dayFilter.addEventListener("change", function () {
                fetchMealPlan(dayFilter.value);
            });

            fetchMealPlan(dayFilter.value);
        });
    </script>
</head>

<body>
    <nav class="navbar transparency">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="activity.html">Activity Statistics</a></li>
          <li><a href="food.html">Food Recommendations</a></li>
          <li><a href="log.html">SIGN-IN / SIGN-UP</a></li>
        </ul>
      </nav>
    <div class="transparency">
        <div id="top-content">
            <h1>Food Recommendation</h1>
            <label for="day-filter">Select Day:</label>
            <select id="day-filter">
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>
            </select>
        </div>

        <div id="meal-plan"></div>
    </div>
</body>

</html>
